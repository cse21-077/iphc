<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3F76C5"/>
      <stop offset="100%" stop-color="#245196"/>
    </linearGradient>
    <linearGradient id="redGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EF4444"/>
      <stop offset="100%" stop-color="#D13138"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Background rounded squircle -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>

  <!-- Outer ring -->
  <circle cx="256" cy="256" r="200" fill="none" stroke="#FFFFFF" stroke-width="8" stroke-opacity="0.3"/>
  <circle cx="256" cy="256" r="182" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-opacity="0.2"/>

  <!-- Decorative curved accents inspired by reference -->
  <path d="M 120 380 Q 256 320 392 380" fill="none" stroke="url(#redGrad)" stroke-width="12" stroke-linecap="round"/>

  <!-- Center emblem backing -->
  <circle cx="256" cy="230" r="120" fill="#FFFFFF" filter="url(#shadow)"/>

  <!-- IPHC Cross and Crown / Star motif -->
  <!-- Cross in Primary Red #D13138 -->
  <path d="M 244 140 H 268 V 300 H 244 Z" fill="url(#redGrad)"/>
  <path d="M 210 185 H 302 V 209 H 210 Z" fill="url(#redGrad)"/>

  <!-- Golden / Blue radiant rays -->
  <circle cx="256" cy="197" r="14" fill="#3F76C5"/>
  <polygon points="256,155 262,175 282,175 266,187 272,207 256,195 240,207 246,187 230,175 250,175" fill="#F59E0B"/>

  <!-- MMUSO Lettering -->
  <text x="256" y="440" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="34" fill="#FFFFFF" letter-spacing="6">MMUSO</text>
  <text x="256" y="472" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="16" fill="#F87171" letter-spacing="3">IPHC MEMBER</text>
</svg>
